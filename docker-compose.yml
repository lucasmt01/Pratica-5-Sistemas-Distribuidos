x-app: &app
  build: .
  profiles: [apps]
  environment:
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: cidade
    RABBITMQ_PASSWORD: cidade123
    CIDADE_DB: /data/cidade.db
  volumes:
    - cidade_data:/data
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: cidade
      RABBITMQ_DEFAULT_PASS: cidade123
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  jardim:
    <<: *app
    command: [python, -m, cidade_inteligente, consumer, jardim]
  semaforo:
    <<: *app
    command: [python, -m, cidade_inteligente, consumer, semaforo]
  iluminacao:
    <<: *app
    command: [python, -m, cidade_inteligente, consumer, iluminacao]
  limpador:
    <<: *app
    command: [python, -m, cidade_inteligente, consumer, limpador]
  menu:
    <<: *app
    command: [python, -m, cidade_inteligente, menu]
    stdin_open: true
    tty: true

volumes:
  rabbitmq_data:
  cidade_data:
